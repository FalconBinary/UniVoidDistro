# live-image: UniVoidDistro's own live image (U6, docs/uni/live-image.md). The programs the
# installer would otherwise compile in the live system's RAM are built here (live/prebuilt.sh),
# and void-mklive at a pinned commit makes the ISO (live/build-image.sh): the kernel series of
# the installed system, the official base image's packages and services, the repository at this
# commit in /root/vh. One image per architecture, each built natively on a runner of that
# architecture (x86_64 on ubuntu-latest, aarch64 on ubuntu-24.04-arm: U5): mklive chroots into
# the image's root, and the desktop is built for the host. Each ISO carries a GitHub build
# provenance attestation:
#   gh attestation verify ISO --repo FalconBinary/UniVoidDistro
# On demand the ISOs are this run's artifacts, univoiddistro-live-ARCH (kvm-smoke takes one with
# live_run=RUN); on a v* tag they are release assets as well.
name: live-image
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "the images to build, space-separated: x86_64 aarch64 (both by default)"
        default: "x86_64 aarch64"
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: the images to build (on demand the arch input; a tag builds both), each on a runner of its architecture
        id: list
        env:
          ARCHES: ${{ github.event.inputs.arch || 'x86_64 aarch64' }}
        run: |
          set -euo pipefail
          list=""
          for a in $ARCHES; do
            case $a in
              x86_64) r=ubuntu-latest ;;
              aarch64) r=ubuntu-24.04-arm ;;
              *) echo "no live image for $a (x86_64, aarch64)"; exit 1 ;;
            esac
            list="$list{\"arch\":\"$a\",\"runner\":\"$r\"},"
          done
          test -n "$list"
          echo "list=[${list%,}]" >> "$GITHUB_OUTPUT"
          echo "images: [${list%,}]"
  build:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: the runner (${{ matrix.arch }}), and whether it has /dev/kvm (docs/uni/live-image.md, "aarch64")
        run: |
          uname -m
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "the runner is $(uname -m), the image ${{ matrix.arch }}"; exit 1; }
          nproc; free -m | head -2
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "no /dev/kvm on this runner"; fi
      - uses: ./.github/actions/setup-zig
      - name: the programs of the image (live/prebuilt.sh)
        run: sh live/prebuilt.sh "$RUNNER_TEMP/prebuilt"
      - name: the image (void-mklive in a privileged Void container)
        run: |
          set -euo pipefail
          # the kernel's modules for mklive's loop mounts (the EFI image's FAT, the root image's
          # ext3), loaded here: the container has no /lib/modules, so mklive's own "modprobe -q
          # loop || :" finds no modprobe there and goes on
          sudo modprobe -a loop vfat ext4
          docker run --rm --privileged -e GITHUB_RUN_ID \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/w" \
            ghcr.io/void-linux/void-glibc-full:latest sh -c '
              set -e
              . /src/live/mklive.pins
              xbps-install -Syu xbps >/dev/null
              xbps-install -Syu >/dev/null
              xbps-install -Sy $LIVE_HOST_PKGS >/dev/null
              git config --global --add safe.directory /src
              bash /src/live/build-image.sh /w/prebuilt /w/out'
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sha256sum -c SHA256SUMS
          cat BUILD
          echo "packages: $(wc -l < live-packages.txt)"; grep -E '^(linux[0-9.]+|linux-firmware[a-z-]*|xbps|cryptsetup)-[0-9]' live-packages.txt
          ls -l
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/out/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: univoiddistro-live-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: univoiddistro-live-*
          path: out
      - name: the ISOs as release assets of ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd out
          # one directory per architecture (the artifact's name); the files of each keep their
          # names, SHA256SUMS included, so each image is checked in its own directory and the
          # release gets ARCH-SHA256SUMS
          assets=""
          lines=""
          for d in univoiddistro-live-*/; do
            a=${d#univoiddistro-live-} a=${a%/}
            ( cd "$d" && sha256sum -c SHA256SUMS )
            iso=$(cd "$d" && ls -- *.iso) sum=$(cut -d' ' -f1 "$d/SHA256SUMS")
            cp "$d/SHA256SUMS" "$a-SHA256SUMS"; cp "$d/BUILD" "$a-BUILD"; cp "$d/live-packages.txt" "$a-live-packages.txt"
            assets="$assets $d$iso $a-SHA256SUMS $a-BUILD $a-live-packages.txt"
            lines="$lines
          - \`$iso\` ($a): sha256 \`$sum\`; the attestation: \`curl -fsSL https://api.github.com/repos/$GH_REPO/attestations/sha256:$sum | jq -c '.attestations[].bundle' > bundle.jsonl && gh attestation verify $iso --bundle bundle.jsonl --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/live-image.yml --source-ref refs/tags/$GITHUB_REF_NAME --deny-self-hosted-runners\`"
          done
          commit=$(sed -n 's/^COMMIT=//p' x86_64-BUILD)
          fence='```'
          # the release's own check, as docs/uni/install.md gives it: no GitHub account, the
          # attestation by the ISO's sha256 from the public API, this workflow and this tag
          notes=$(cat <<EOF
          UniVoidDistro $GITHUB_REF_NAME for x86_64 machines with a 64-bit UEFI and for ARM64 machines with UEFI (U5), built from commit ${commit:0:12}.

          Check a live image before writing it to a USB stick; no GitHub account is needed. The download is whole (on macOS: \`shasum -a 256 -c ARCH-SHA256SUMS\`):

          $fence
          sha256sum -c x86_64-SHA256SUMS
          $fence

          This repository's live-image workflow built each image from this tag (GitHub CLI, curl and jq):
          $lines

          How to install it: [docs/uni/install.md](https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/docs/uni/install.md). \`vh-tools-x86_64.tar.gz\` holds the Zig tools (the zig-test workflow).
          EOF
          )
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "UniVoidDistro $GITHUB_REF_NAME" --notes "$notes"
          # zig-test, ten minutes into the same tag, usually makes the release first with notes of
          # its own (v0.1.0): the image's notes say what the release is and how to check it
          gh release edit "$GITHUB_REF_NAME" --title "UniVoidDistro $GITHUB_REF_NAME" --notes "$notes"
          # shellcheck disable=SC2086 # the asset paths have no spaces
          gh release upload "$GITHUB_REF_NAME" $assets --clobber
