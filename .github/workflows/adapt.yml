# Track A: the plan of any machine. The hardware-constant lint (tests/adapt/lint.sh), vh-plan's
# unit tests and the golden plans of every machine in kernel/hw (tests/adapt/run.sh), vh-kconf's
# tests with the probe of every fixture and resolve on the GF63's plan (tests/kernel/run.sh),
# the GF63 oracle (tests/kernel/oracle.sh), the cheap half of the kernel matrix: every machine,
# x86_64 and aarch64, planned in tiered mode and resolved, with the checks that need no kernel tree
# (tests/kernel/matrix.sh; the build is kernel-custom with hw=all, docs/uni/kernel.md), and the
# installer's lists per plan, the GF63's against upstream's (tests/install/run.sh).
name: adapt
on:
  push:
    branches: [main]
    paths: ["adapt/**", "hwdb/**", "kernel/**", "install/**", "rootfs/**", "optional/**", "tests/adapt/**", "tests/kernel/**", "tests/install/**", "tests/docker/**", "vh.conf.example", "zig/lib/**", ".github/workflows/adapt.yml"]
  pull_request:
    paths: ["adapt/**", "hwdb/**", "kernel/**", "install/**", "rootfs/**", "optional/**", "tests/adapt/**", "tests/kernel/**", "tests/install/**", "tests/docker/**", "vh.conf.example", "zig/lib/**", ".github/workflows/adapt.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: hardware constants only in hwdb/, class fragments, fixtures, pins (docs/uni/principles.md, rule 1)
        run: sh tests/adapt/lint.sh
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - name: vh-plan, unit tests and the golden plan of every machine (twice each)
        run: sh tests/adapt/run.sh
      - name: vh-kconf, unit tests and the probe of every fixture
        run: sh tests/kernel/run.sh
      - name: the GF63 oracle (the kernel configuration of upstream)
        run: sh tests/kernel/oracle.sh
      - name: the machine kernel of every machine, x86_64 and aarch64, without a kernel tree (plan, resolve, the checks)
        run: |
          set -eu
          # the -march check asks the compiler kernel-custom builds with
          command -v clang >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q clang; }
          sh tests/kernel/matrix.sh
      - name: the installer's lists per plan (the GF63's are upstream's)
        run: sh tests/install/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plans
          path: build/at/plans
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-matrix
          path: |
            build/km
            !build/km/bin
          if-no-files-found: ignore
