# A full installation on the QEMU rig under KVM (tests/vm/vhvm.py install), then check.py base,
# then the installed rig's own hw.zon and plan (the real qemu-q35 fixture).
# Hours long, so it runs on demand and weekly, not on every push. The live ISO is verified
# against Void's signed sha256sum.txt (minisign key and ISO name pinned in tests/vm/void-live.pins).
name: kvm-smoke
on:
  workflow_dispatch:
    inputs:
      step:
        description: "check.py step after the installation (base; assess: the boot assessment of a machine UKI, docs/uni/kernel.md)"
        default: base
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
env:
  # the VM's RAM in MiB: 4 GiB for now, since the RefursWM build ran out of memory in vhvm.py's
  # default 3 GiB (run 39297735098); back to 3072 once the installer fits (it prints its RAM at
  # every heading)
  VH_MEM: "4096"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: /dev/kvm for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: qemu, OVMF, swtpm, xorriso, minisign, bsdtar
        run: |
          sudo apt-get update -q
          # libarchive-tools: bsdtar, which unpacks the live ISO's kernel (tests/vm/vhvm.py)
          sudo apt-get install -y -q qemu-system-x86 ovmf swtpm xorriso minisign libarchive-tools
      - uses: ./.github/actions/setup-zig
      - name: the Void live ISO, verified
        run: |
          set -euo pipefail
          . tests/vm/void-live.pins
          mkdir -p iso && cd iso
          curl -fsSL -o "$ISO" "$BASE/$ISO"
          curl -fsSL -o sha256sum.txt "$BASE/sha256sum.txt"
          curl -fsSL -o sha256sum.sig "$BASE/sha256sum.sig"
          minisign -Vm sha256sum.txt -x sha256sum.sig -P "$KEY"
          # sha256sum.txt is in the BSD format, "SHA256 (NAME) = HASH": the ISO's own hash must
          # be in the signed file, on exactly that line
          sum=$(sha256sum "$ISO" | cut -d' ' -f1)
          grep -qFx "SHA256 ($ISO) = $sum" sha256sum.txt || { echo "$ISO: sha256 $sum is not in the signed sha256sum.txt"; exit 1; }
      - name: the tools and thor for the VM (tests/zig/build.sh)
        run: sh tests/zig/build.sh
      - name: vh-stage1 for the VM (tests/init/build.sh; the stage1 step installs it)
        run: sh tests/init/build.sh
      - name: install
        env:
          VH_ACCEL: kvm
        run: python3 tests/vm/vhvm.py install --iso "iso/$(. tests/vm/void-live.pins; echo $ISO)" --mem "$VH_MEM" --timeout 10800
      - name: check
        env:
          VH_ACCEL: kvm
        run: python3 tests/vm/check.py "${{ github.event.inputs.step || 'base' }}" --repo --mem "$VH_MEM"
      - name: the rig's real hw.zon and plan (they replace the synthesised qemu-q35 fixture)
        env:
          VH_ACCEL: kvm
        run: |
          python3 tests/vm/vhvm.py boot --mem "$VH_MEM" --timeout 1800 \
            --run "doas /usr/local/sbin/vh-kconf probe --stdout" \
            --run "cat /etc/vh/plan-report.txt" | tee build-vm-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-smoke-serial-log
          path: |
            tests/vm/work/serial.log
            build-vm-probe.log
          if-no-files-found: ignore
