# A full installation on the QEMU rig under KVM (tests/vm/vhvm.py install), then check.py base,
# then the installed rig's own hw.zon and plan (the real qemu-q35 fixture). With kernel_run, the
# qemu-q35 kernel of that kernel-custom run is downloaded into build/kernel-custom, for the step
# machine: vh-kconf install and the boot assessment of a real machine kernel (docs/uni/kernel.md).
# Hours long, so it runs on demand and weekly, not on every push. The live ISO is verified
# against Void's signed sha256sum.txt (minisign key and ISO name pinned in tests/vm/void-live.pins).
# With live_run, it is our own image of that live-image run instead (docs/uni/live-image.md):
# its sha256, its build provenance attestation, and its commit must be this run's, so that the
# installer takes the image's programs instead of building them. With mac=selinux the policy is
# compiled here (selinux/build.sh, secilc in a Fedora container) and the installation takes it
# through VH_SELINUX_DIR: Void's image has no policy; ours brings it (docs/uni/selinux.md).
# With arch=aarch64 (U5) the rig is QEMU's virt machine with AAVMF on GitHub's arm64 runner
# (ubuntu-24.04-arm), from our aarch64 image (live_run is required: Void has no aarch64 live
# ISO); the runner's /dev/kvm decides the accelerator, and without it the run stops before
# the installation unless accel=tcg asks for the slow path (docs/uni/hardware.md, "ARM64").
name: kvm-smoke
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "the rig's architecture: x86_64 (q35, OVMF, ubuntu-latest) or aarch64 (virt, AAVMF, ubuntu-24.04-arm; needs live_run)"
        default: x86_64
      accel:
        description: "auto: KVM where the runner has /dev/kvm, else stop; tcg: emulate (hours; for aarch64 without KVM)"
        default: auto
      step:
        description: "check.py steps after the installation, comma-separated, in order (base; assess: the boot assessment of a machine UKI; machine: vh-kconf install of kernel_run's kernel, docs/uni/kernel.md; vhinit: vh-init as PID 1, kept for the steps after it, vhinit-rollback: runit back, init/README.md; sched: vh-sched under vh-init on kernel_run's kernel, sched/README.md; selinux: the policy permissive on that kernel under vh-init, with mac=selinux)"
        default: base
      mac:
        description: "VH_MAC of the installation: apparmor, or selinux (the policy of selinux/ built here, permissive at boot; docs/uni/selinux.md)"
        default: apparmor
      kernel_run:
        description: "the id of a kernel-custom run that built qemu-q35 (hw=all or hw=kernel/hw/qemu-q35.zon), for the step machine"
        default: ""
      kver:
        description: the kernel version of that run
        default: "6.18.57"
      game_kernel_run:
        description: "the id of a game-kernel run (the gaming kernel as vh-game kernel build builds it, for qemu-q35), for the step gamekernel (docs/uni/game.md)"
        default: ""
      live_run:
        description: "the id of a live-image run of this commit: install from its ISO instead of Void's"
        default: ""
      mem:
        description: "the VM's RAM in MiB (empty: 3072); below 3 GiB only with live_run, since on Void's image the installer builds in RAM and refuses less"
        default: ""
      security:
        description: "VH_SECURITY of the installation: strict, or tiered (below 2 GiB strict refuses: Argon2id with 1 GiB)"
        default: strict
      mirror:
        description: "the Void package mirror (VH_MIRROR, https://...) for the installer, the dev image and the sysroot; empty: repo-default"
        default: ""
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
  # the artifact of another run (download-artifact with run-id)
  actions: read
  # gh attestation verify, for live_run
  attestations: read
env:
  # the VM's RAM in MiB. 3 GiB by default: what the installer needs when it builds its programs
  # in RAM (Void's image; install/lib.sh need_build_ram), so the weekly run shows that it fits
  # there (it peaks at 2.1 GiB, the RefursWM build, and prints its RAM at every heading). With
  # live_run as low as the gate's floor, 1.5 GiB (hwdb/security.zon memory-floor), in tiered mode
  # below 2 GiB. 4096 while the live ISO rode along (run 39297735098)
  VH_MEM: ${{ github.event.inputs.mem || '3072' }}
  VH_SECURITY: ${{ github.event.inputs.security || 'strict' }}
  VH_MAC: ${{ github.event.inputs.mac || 'apparmor' }}
  VH_MIRROR: ${{ github.event.inputs.mirror || 'https://repo-default.voidlinux.org' }}
  VH_ARCH: ${{ github.event.inputs.arch || 'x86_64' }}
jobs:
  smoke:
    runs-on: ${{ (github.event.inputs.arch || 'x86_64') == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: the architecture and what it needs
        run: |
          set -euo pipefail
          echo "rig: $VH_ARCH on $(uname -m), $(nproc) CPUs"
          case $VH_ARCH in
            x86_64) [ "$(uname -m)" = x86_64 ] ;;
            aarch64)
              [ "$(uname -m)" = aarch64 ]
              [ -n "${{ github.event.inputs.live_run }}" ] || { echo "arch=aarch64 needs live_run: Void publishes no aarch64 live ISO, ours comes from a live-image run"; exit 1; }
              [ -z "${{ github.event.inputs.kernel_run }}${{ github.event.inputs.game_kernel_run }}" ] || { echo "kernel_run and game_kernel_run are x86_64 (qemu-q35) only"; exit 1; } ;;
            *) echo "arch: x86_64 or aarch64"; exit 1 ;;
          esac
      - name: the qemu-q35 machine kernel of kernel-custom run ${{ github.event.inputs.kernel_run }}
        if: github.event.inputs.kernel_run != ''
        uses: actions/download-artifact@v4
        with:
          name: kernel-custom-qemu-q35-${{ github.event.inputs.kver || '6.18.57' }}
          run-id: ${{ github.event.inputs.kernel_run }}
          github-token: ${{ github.token }}
          path: build/kernel-custom
      - name: the gaming kernel of game-kernel run ${{ github.event.inputs.game_kernel_run }}
        if: github.event.inputs.game_kernel_run != ''
        uses: actions/download-artifact@v4
        with:
          name: game-kernel-qemu-q35-${{ github.event.inputs.kver || '6.18.57' }}
          run-id: ${{ github.event.inputs.game_kernel_run }}
          github-token: ${{ github.token }}
          path: build/game-kernel
      - name: "/dev/kvm for the runner user (the accelerator: KVM, or none on a runner without it)"
        env:
          ACCEL: ${{ github.event.inputs.accel || 'auto' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the event: wait until udev has applied the mode (run 39314915946
          # tested too early); ls shows whether the runner has /dev/kvm at all
          sudo udevadm settle
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "no /dev/kvm on this $(uname -m) runner"; fi
          case $ACCEL in
            tcg) echo "VH_ACCEL=tcg" >> "$GITHUB_ENV" ;;
            auto) test -r /dev/kvm && test -w /dev/kvm || { echo "no usable /dev/kvm: the installation under TCG takes hours; accel=tcg asks for it, or run the rig under hvf on a Mac (docs/uni/hardware.md)"; exit 1; }
                  echo "VH_ACCEL=kvm" >> "$GITHUB_ENV" ;;
            *) echo "accel: auto or tcg"; exit 1 ;;
          esac
      - name: qemu, the UEFI firmware, swtpm, xorriso, minisign, bsdtar
        run: |
          sudo apt-get update -q
          # libarchive-tools: bsdtar, which unpacks the live ISO's kernel (tests/vm/vhvm.py)
          case $VH_ARCH in
            x86_64) pk="qemu-system-x86 ovmf" ;;
            # qemu-efi-aarch64: AAVMF with its Secure Boot build (tests/vm/vhvm.py find_firmware)
            aarch64) pk="qemu-system-arm qemu-efi-aarch64" ;;
          esac
          # shellcheck disable=SC2086 # a list of packages
          sudo apt-get install -y -q $pk swtpm xorriso minisign libarchive-tools
      - uses: ./.github/actions/setup-zig
      - name: our live ISO of live-image run ${{ github.event.inputs.live_run }}
        if: github.event.inputs.live_run != ''
        uses: actions/download-artifact@v4
        with:
          name: univoiddistro-live-${{ github.event.inputs.arch || 'x86_64' }}
          run-id: ${{ github.event.inputs.live_run }}
          github-token: ${{ github.token }}
          path: iso-live
      - name: our live ISO, verified (sha256, attestation, this commit)
        if: github.event.inputs.live_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd iso-live
          sha256sum -c SHA256SUMS
          iso=$(sed -n 's/^ISO=//p' BUILD)
          gh attestation verify "$iso" --repo "$GITHUB_REPOSITORY"
          built=$(sed -n 's/^COMMIT=//p' BUILD)
          [ "$built" = "$GITHUB_SHA" ] || { echo "the image is of $built, this run of $GITHUB_SHA: the installer would build instead of taking the image's programs"; exit 1; }
          cat BUILD
          echo "VH_ISO=$PWD/$iso" >> "$GITHUB_ENV"
      - name: the Void live ISO, verified
        if: github.event.inputs.live_run == ''
        run: |
          set -euo pipefail
          . tests/vm/void-live.pins
          mkdir -p iso && cd iso
          # the first mirror that answers serves all three files; the signature decides, not the mirror
          got=""
          for m in $MIRRORS; do
            echo "== $m"
            if curl -fsSL --connect-timeout 20 -m 1200 -o "$ISO" "$m/$ISO" \
               && curl -fsSL --connect-timeout 20 -m 120 -o sha256sum.txt "$m/sha256sum.txt" \
               && curl -fsSL --connect-timeout 20 -m 120 -o sha256sum.sig "$m/sha256sum.sig"; then got=$m; break; fi
            echo "$m: not reachable or incomplete, the next mirror"
          done
          [ -n "$got" ] || { echo "no mirror served $ISO"; exit 1; }
          minisign -Vm sha256sum.txt -x sha256sum.sig -P "$KEY"
          # sha256sum.txt is in the BSD format, "SHA256 (NAME) = HASH": the ISO's own hash must
          # be in the signed file, on exactly that line
          sum=$(sha256sum "$ISO" | cut -d' ' -f1)
          grep -qFx "SHA256 ($ISO) = $sum" sha256sum.txt || { echo "$ISO: sha256 $sum is not in the signed sha256sum.txt"; exit 1; }
          echo "VH_ISO=$PWD/$ISO" >> "$GITHUB_ENV"
      - name: the tools and thor for the VM (tests/zig/build.sh)
        run: sh tests/zig/build.sh
      - name: vh-stage1 for the VM (tests/init/build.sh; the stage1 step installs it)
        run: sh tests/init/build.sh
      - name: the SELinux policy (selinux/build.sh, secilc in a Fedora container), for VH_MAC=selinux
        if: env.VH_MAC == 'selinux'
        run: |
          sh selinux/build.sh build/selinux
          cat build/selinux/BUILD
      - name: install
        run: |
          set --
          [ "$VH_MAC" != selinux ] || set -- --selinux build/selinux
          python3 tests/vm/vhvm.py install --iso "$VH_ISO" --mem "$VH_MEM" --timeout 10800 \
            --conf "VH_SECURITY=\"$VH_SECURITY\"" --conf "VH_MAC=\"$VH_MAC\"" --conf "VH_MIRROR=\"$VH_MIRROR\"" "$@"
      - name: check
        run: python3 tests/vm/check.py "${{ github.event.inputs.step || 'base' }}" --repo --mem "$VH_MEM"
      - name: "the rig's hw.zon at installation (kernel/hw/qemu-q35.zon; on aarch64 the virt fixture to be), its probe now, the plan, vh-kconf check"
        run: |
          python3 tests/vm/vhvm.py boot --mem "$VH_MEM" --timeout 1800 \
            --run "doas cat /etc/vh/hw.zon" \
            --run "doas /usr/local/sbin/vh-kconf probe --stdout" \
            --run "cat /etc/vh/plan-report.txt" \
            --run "doas sh -c 'cat /run/vh/check.done; cat /run/vh/check 2>/dev/null'" | tee build-vm-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-smoke-serial-log
          path: |
            tests/vm/work/serial.log
            build-vm-probe.log
          if-no-files-found: ignore
