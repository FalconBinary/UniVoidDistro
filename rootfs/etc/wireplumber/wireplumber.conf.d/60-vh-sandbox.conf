# void-hardperf-light: permissions of "restricted" clients, the browser sandbox (docs/08).
# By default WirePlumber gives them rx on everything, so the microphone is visible and can
# be connected to their own stream. Here audio and video sources are invisible to them.
access.permission-managers = [
  {
    name = "vh-sandbox"
    default_permissions = "rx"
    core_permissions = "rx"
    rules = [
      {
        matches = [
          { media.class = "Audio/Source" }
          { media.class = "Audio/Source/Virtual" }
          { media.class = "Audio/Duplex" }
          { media.class = "Video/Source" }
          { media.class = "Video/Source/Virtual" }
        ]
        actions = { set-permissions = "-" }
      }
    ]
  }
]

access.rules = [
  {
    matches = [ { access = "restricted" } ]
    actions = { update-props = { permission_manager_name = "vh-sandbox" } }
  }
]
