# foot (terminal), void-hardperf-light (docs/05). The terminal shows untrusted text.
[main]
font=monospace:size=11

[url]
# links open only by hand (Ctrl+Shift+O) and are not launched but copied to the
# clipboard: paste them into the browser yourself
launch=wl-copy ${url}

[desktop-notifications]
# program notifications (OSC 99/777) run no commands at all: foot treats an empty value
# as a syntax error, hence the dummy command
command=/usr/bin/true

[security]
# OSC 52: a program in the terminal may put text into the clipboard but not read it
osc52=copy-enabled
