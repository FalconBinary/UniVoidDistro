# void-hardperf-light: vh-acpid, lid and power button (docs/05, docs/12).
# Lid closed -> screen lock at once; closed longer than LID_MIN minutes -> regular
# poweroff (suspend is forbidden). With an external monitor the lid does nothing.
LID_MIN=10
# Power button: poweroff -- regular shutdown; lock -- screen lock; ignore -- nothing.
# A long press (4 s) is a hardware power-off that bypasses the system (residual risk, docs/05).
POWER_KEY=poweroff
# Idle watchdog (0 is off; optional/deadman sets 15 and 60): lock and regular poweroff
# without PHYSICAL input from the internal keyboard and touchpad. The browser's
# idle-inhibit (video) does not stop it; the compromise for video is IDLE_LOCK_MIN.
IDLE_LOCK_MIN=0
IDLE_POWEROFF_MIN=0
# Internal keyboard on internal USB (most laptops have a PS/2 one, i8042): a substring of the
# device's sysfs path, e.g. "/usb1/1-8/" (see 00-probe.sh, section "Input devices").
INTERNAL_INPUT=""
