# void-hardperf-light: a separate PulseAudio socket for the browser sandbox (docs/08).
# Clients of this socket get access=restricted: WirePlumber grants their permissions
# (wireplumber.conf.d/60-vh-sandbox.conf): playback yes, microphone and camera no.
# The server.address array is replaced as a whole, so "unix:native" is listed again.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:/run/vh-sandbox/pulse" client.access = "restricted" }
    ]
}
