# UniVoidDistro: cfg80211, the Wi-Fi core, loads only as the dependency of a Wi-Fi driver.
# Its one alias is the generic netlink family nl80211: any process that asks for the family
# loads it, and dhcpcd does at every start, for every interface. On a machine without Wi-Fi it
# then asks for regulatory.db, which the firmware trim keeps only with a wireless interface
# (hwdb/net.zon, net.wifi), and vh-kconf check reports the failure at every boot.
# "blacklist" makes modprobe ignore the module's aliases only: iwlwifi, mt7921e and the other
# drivers still load it, so a Wi-Fi card, or a USB adapter plugged in later, works as before.
# docs/uni/runtime.md, "vh-kconf check".
blacklist cfg80211
