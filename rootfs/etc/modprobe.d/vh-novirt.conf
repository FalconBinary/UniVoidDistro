# UniVoidDistro: with VH_VIRT=no the modules of modules.devname that serve virtual machines load
# only when root names them (vh-devnodes.conf says why stage 1 would load them). eudev's rules
# make their device nodes world-writable (/dev/net/tun, /dev/vhost-net, /dev/vhost-vsock,
# /dev/vfio/vfio: 0666), so every process could reach their code; the module lock kept them.
# With VH_VIRT=yes the installer removes this file (install/chroot.sh): qemu needs the nodes.
# docs/uni/runtime.md, "Kernel modules at boot".
blacklist tun
blacklist vhost_net
blacklist vhost_vsock
blacklist vfio
