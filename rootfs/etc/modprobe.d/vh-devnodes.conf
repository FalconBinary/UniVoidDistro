# UniVoidDistro: modules of modules.devname that load only as the dependency of a driver, or
# when root names them (doas modprobe NAME). Stage 1 loads every module of modules.devname at
# every boot, so that its device node exists: runit-void's 01-static-devnodes.sh and
# vh-stage1 both run "modprobe -b", which skips a blacklisted name. Without this file every
# machine loaded these and their dependencies, and install/30-lock.sh preloaded them all
# before the module lock. "blacklist" makes modprobe ignore the module's aliases and, with -b,
# its name; a driver that needs one still loads it as a dependency.
# docs/uni/runtime.md, "Kernel modules at boot".
#
# A virtual Bluetooth controller for testing; it brought the Bluetooth stack to every machine.
blacklist hci_vhci
# The Bluetooth stack: btusb and hci_uart load it with a controller. Without one,
# socket(AF_BLUETOOTH) no longer loads it for any process.
blacklist bluetooth
# serio emulation for testing; virtual input devices, which nothing in this system creates.
blacklist userio
blacklist uinput
# PPP: there is no pppd here.
blacklist ppp_generic
# The CMOS NVRAM of x86 machines: thinkpad_acpi still loads it.
blacklist nvram
# The ALSA sequencer serves MIDI only (WirePlumber's Midi-Bridge); PipeWire's audio does not
# use it. For MIDI: doas modprobe snd_seq, before 30-lock.sh so that the lock keeps it.
blacklist snd_seq
# Every sound driver loads the ALSA timer (through snd_pcm).
blacklist snd_timer
# Not rfkill: vh-keys and install/00-probe.sh run rfkill(8) under "set -e", and it fails
# without /dev/rfkill on a machine with no radio; the node is root's only (99-vh-devices.rules).
