# void-hardperf-light: iwd, Wi-Fi without wpa_supplicant and NetworkManager (docs/06, docs/07).
# Options checked against iwd.config(5) of version 3.12.
[General]
# iwd's own DHCP client; static addresses go into the network profile ([IPv4])
EnableNetworkConfiguration=true
# a stable random MAC per network; all 6 octets (no Intel OUI)
AddressRandomization=network
AddressRandomizationRange=full
# PMF when the access point supports it (2 = required, which breaks networks without PMF)
ManagementFrameProtection=1
RoamThreshold=-70
RoamThreshold5G=-76
DisableANQP=true

[Network]
EnableIPv6=false
# DNS from DHCP is ignored: the resolver is only the local unbound
NameResolvingService=none
# Ethernet (dhcpcd, metric 100) beats Wi-Fi
RoutePriorityOffset=300

[Scan]
# a new network is found sooner; the price is battery and airtime (docs/07)
InitialPeriodicScanInterval=3
MaximumPeriodicScanInterval=30

[Rank]
BandModifier5GHz=1.5

[Blacklist]
# a single failure does not exclude an access point for long
InitialTimeout=10
MaximumTimeout=300

[DriverQuirks]
# do not recreate the interface at start: faster, and the wlan0 settings are kept
DefaultInterface=iwlwifi
# Wi-Fi power saving is always off (the "network speed" profile)
PowerSaveDisable=iwlwifi
