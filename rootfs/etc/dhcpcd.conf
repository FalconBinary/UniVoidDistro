# void-hardperf-light: DHCP for the wired network only (docs/06).
allowinterfaces eth0
ipv4only
noipv6rs
# DNS, NTP and the host name from DHCP are not accepted: the resolver is unbound, time is chrony (NTS)
nohook resolv.conf, ntp.conf, timesyncd.conf, hostname, wpa_supplicant
nooption domain_name_servers, domain_name, domain_search, ntp_servers, host_name
# our own name is not sent: there is no "hostname" option in this file
# Ethernet beats Wi-Fi (iwd has RoutePriorityOffset=300)
metric 100
# no ARP conflict check: the lease arrives 1-2 s sooner (docs/07)
noarp
