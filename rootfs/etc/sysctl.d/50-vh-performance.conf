# void-hardperf-light: memory, disk writes, scheduler (docs/11, docs/15). Weakens no protection.
# Compared with the CachyOS settings: everything that opens no new attack path was taken.

# --- swap in zram (compressed RAM, no disk)
# zram is cheaper than re-reading files from disk
vm.swappiness = 180
# zram: read one page at a time, no readahead
vm.page-cluster = 0
# --- memory pressure: kswapd starts earlier and more smoothly, fewer stalls
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# the file name and inode cache lives longer: faster search and builds, git status, ls
vm.vfs_cache_pressure = 50
# --- dirty pages: at most 256 MB, background writeback from 64 MB. Copying to a USB stick
# or unpacking does not fill RAM with gigabytes of unflushed data (the system does not
# "freeze" on sync), and there is less plaintext of recently written files in RAM.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# --- CPU scheduler
# background load from a terminal does not take CPU away from the UI
kernel.sched_autogroup_enabled = 1
