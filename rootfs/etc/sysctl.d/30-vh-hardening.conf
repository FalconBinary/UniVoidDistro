# void-hardperf-light: hardening sysctls. Every line says what it closes (docs/05-system.md).
# Applied in runit stage 1 (08-sysctl.sh). net.* values apply to the network namespace
# they are set in (here the init netns); new netns get the kernel defaults.

# --- leaks of kernel addresses and logs
# kernel addresses in /proc are hidden even from root
kernel.kptr_restrict = 2
# dmesg only with CAP_SYSLOG
kernel.dmesg_restrict = 1
# only errors on the console
kernel.printk = 3 3 3 3
# upstream maximum; "3" is a Debian patch and has no effect here
kernel.perf_event_paranoid = 2

# --- kernel attack surface
# eBPF only with CAP_BPF; 1 cannot be undone until reboot
kernel.unprivileged_bpf_disabled = 1
# constants in BPF JIT code are blinded (against JIT spraying)
net.core.bpf_jit_harden = 2
# no loading another kernel around Secure Boot
kernel.kexec_load_disabled = 1
# ptrace only with CAP_SYS_PTRACE (3 denies everyone, docs/05)
kernel.yama.ptrace_scope = 2
# io_uring off: a frequent source of LPEs
kernel.io_uring_disabled = 2
# userfaultfd is a race-condition tool in exploits
vm.unprivileged_userfaultfd = 0
# magic SysRq keys from the keyboard are off
kernel.sysrq = 0
# AppArmor policies cannot be loaded from a userns
kernel.unprivileged_userns_apparmor_policy = 0
# rare line disciplines are not loaded on demand
dev.tty.ldisc_autoload = 0
# TIOCSTI (injecting into another terminal) is denied
dev.tty.legacy_tiocsti = 0
# MPTCP is built in and reachable without privileges
net.mptcp.enabled = 0
# memfds without MFD_NOEXEC_SEAL get it; MFD_EXEC is refused
vm.memfd_noexec = 2

# --- address space randomisation
kernel.randomize_va_space = 2
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# --- file systems: links and files in shared sticky directories
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# upstream default 0
fs.protected_fifos = 2
# upstream default 0
fs.protected_regular = 2

# --- core dumps (may contain keys and passwords)
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# --- panic and oops
# mirrors panic=10 from the cmdline: reboot instead of hanging
kernel.panic = 10
# brute force through many oopses hits a limit
kernel.oops_limit = 100
# a hang without a panic (soft/hard lockup) also leads to a reboot through the firmware
# (MOR wipes RAM) instead of leaving the machine powered with the LUKS key in memory.
# The hard lockup detector runs off the NMI watchdog (kernel.nmi_watchdog=1, the Void
# kernel default; nowatchdog and nmi_watchdog=0 are forbidden, docs/11). A VM without a PMU has none.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
