# noextract: the file is extracted neither at installation nor on updates.
# SUID programs nobody needs (docs/02):
noextract=/usr/bin/su
noextract=/usr/bin/sg
noextract=/usr/bin/newgrp
noextract=/usr/bin/chsh
noextract=/usr/bin/chfn
noextract=/usr/bin/expiry
noextract=/usr/bin/gpasswd
# newuidmap/newgidmap: mapping subuid ranges into a user namespace (podman and the like).
noextract=/usr/bin/newuidmap
noextract=/usr/bin/newgidmap
# wall, write: SGID tty, writing into other terminals (util-linux). Checked on the bench:
# they are SGID in Void.
noextract=/usr/bin/wall
noextract=/usr/bin/write
# utempter: the SGID utmp helper of libutempter (pulled in by foot): records "who is logged in".
# Without it foot simply writes no utmp record.
noextract=/usr/lib/utempter/utempter
# xbps-uchroot: SUID helper for building packages (xbps-src); nothing is built here.
noextract=/usr/bin/xbps-uchroot
# dbus-daemon-launch-helper: SUID, starts D-Bus services on demand (activation).
# Here services are started by runit; activation is not used.
noextract=/usr/libexec/dbus-daemon-launch-helper
# AppArmor: the stock 09-apparmor.sh compiles all ~150 profiles of the package at every boot
# and without a cache. 09-vh-apparmor.sh replaces it: only the needed profiles, from the cache.
noextract=/etc/runit/core-services/09-apparmor.sh
# runit-void's /etc/runit/ctrlaltdel is replaced by rootfs/etc/runit/ctrlaltdel (the fixed ACPI
# power button through tiny_power_button and vh-acpid): an update must not bring the reboot back
noextract=/etc/runit/ctrlaltdel
