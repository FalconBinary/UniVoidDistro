# ignorepkg: the dependency counts as satisfied and the package is not installed (man xbps.d).
# The apparmor package pulls in Python modules for its graphical utilities (aa-notify etc.).
# The profile parser (apparmor_parser) and aa-status are written in C and do not need them.
ignorepkg=python3-tkinter
ignorepkg=python3-gobject
ignorepkg=python3-dbus
ignorepkg=python3-notify2
ignorepkg=python3-psutil
# python3 itself (apparmor and nftables declare it for their Python bindings) is not installed:
# an interpreter with ctypes creates executable memory and bypasses noexec on /home and /tmp.
# The system tools are written in Zig (zig/) and do not need python3 (docs/05).
ignorepkg=python3
# iwd and wireguard-tools pull in openresolv; our resolv.conf is static (127.0.0.1).
ignorepkg=openresolv
# sudo is never installed: administration goes through opendoas.
ignorepkg=sudo
# xbps and libxbps are replaced by the thor package (docs/18): plain xbps would roll back
# the security policy built into libxbps.
ignorepkg=xbps
ignorepkg=libxbps
